# Shared by primary and replica (SPEC 9.1). A record of these values belongs in
# every run: B-2 depends on idle_in_transaction_session_timeout.
listen_addresses = '*'
max_connections = 200
wal_level = logical
max_replication_slots = 20
max_wal_senders = 20
idle_in_transaction_session_timeout = 10s
track_commit_timestamp = on
hot_standby = on
