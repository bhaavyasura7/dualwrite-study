      P4: { faults: [ { type: crash, target: connect, at_s: [12, 18] } ] }
    expect: Damage per crash scales with load during the burst.

  - id: H-2
    group: H
    priority: optional
    mode: random
    patterns: [P4, P5]
    repeats: 10
