# Diagnostic vectors. NOT part of the study catalogue; used to investigate a
# finding before the real runs. Defaults are copied from vectors.yaml.
# =============================================================================
# Test catalogue — Fault-Injection Study of Database–Kafka Consistency Patterns
# File: experiments/vectors.yaml   ·   Spec version 2.5   ·   November 2026
# =============================================================================
#
# SCHEMA
# ------
# id            Unique vector ID (matches the paper and SPEC.md).
# group         control | A..I | perf
# priority      must | should | optional
# mode          control  – no fault or graceful fault; `assert` is enforced
#               targeted – fault triggered at an exact code point (crash/stall)
#               random   – fault injected at a random time within `at_s`
#               sweep    – no fault; a parameter is varied (performance/tuning)
#               unit     – not run by the runner (e.g. go test)
#               alias    – no own cycles; points at the vectors that cover it
# patterns      List of P1..P5. Every pattern is a separate cell.
# repeats       Repetitions per cell (default from `defaults`).
# topology      Overrides: relays, brokers, replication (async|sync),
#               consumers (list of strategies run in parallel, each its own
#               consumer group and own tables), consumers_per_group.
# env           Fixed environment overrides for this vector.
# sweep         Cartesian product; each combination is a cell.
#               Plain keys      -> environment variables
#               topology.<k>    -> topology field
#               load.<k>        -> load field
#               faults[i].<k>   -> field of the i-th fault (dotted into params)
# cells         Explicit list of override maps (used instead of `sweep` when a
#               cartesian product makes no sense).
# crash         Targeted crash point: {component, point, after_n, instance}.
#               Sets CRASH_AT / CRASH_AFTER_N on that component (all replicas
#               unless `instance` is given). Component dies via SIGKILL.
#               Armed after warm-up; the firing point is drawn from
#               [after_n, 2 x after_n] per cycle (SPEC 7).
# stall         Targeted stall point: {component, point, ms, after_n, instance}.
#               The goroutine at that line sleeps `ms`, then continues
#               (deterministic stand-in for a GC pause; see SPEC 7.2).
# faults        Ordered list of faults. Each:
#                 type        see FAULT TYPES below
#                 target      see TARGETS below
#                 at_s        [lo, hi] seconds after warm-up ends; uniform.
#                             [x, x] = fixed time.
#                 on_log      inject when this log marker appears on target's
#                             component (alternative to at_s)
#                 duration_s  number or [lo, hi] (uniform). Omitted for
#                             one-shot faults (crash, kill_leader, failover).
#                 params      type-specific parameters
# by_pattern    Per-pattern override of any field above (crash/stall/faults/env).
# assert        Enforced only in control vectors (and A-1b, A-2, A-5).
#               A violated assert marks the cycle CONTROL_FAIL and stops the run.
# assert_scope  all (default) | hooked  – `hooked` applies the assert only to the
#               event that hit the crash point, not to collateral damage.
# requires_rebuild  true -> runner rebuilds Postgres primary + replica and
#               repoints the pg proxies after every cycle (failover vectors).
# expect        Hypothesis, recorded with the results. Never enforced.
#
# FAULT TYPES
#   crash               SIGKILL the container
#   graceful_stop       docker stop (SIGTERM + grace period), start after duration
#   restart             docker restart (graceful)
#   pause               docker pause, unpause after duration
#   broker_stop         stop Kafka broker container(s), start after duration
#   proxy_disable       disable a Toxiproxy proxy group (connection cut)
#   latency             Toxiproxy latency toxic; params: latency_ms, jitter_ms
#   withhold_downstream Toxiproxy `timeout` toxic (timeout=0) on the downstream
#                       stream only: requests reach the server, responses never
#                       return (= lost acknowledgements)
#   reset_peer          Toxiproxy reset_peer toxic; params: toxicity (0..1)
#                       (flaky connections; Toxiproxy cannot drop TCP packets)
#   failover            kill primary, pg_promote() replica, repoint pg proxies
#   kill_leader         SIGKILL the broker leading the given partition
#
# TARGETS
#   orderservice, relay (all replicas), relay-1, relay-any (random replica),
#   connect, kafka (all brokers), partition-0-leader, consumers (all strategy
#   containers), consumers-member-1 (first member of every consumer group),
#   kafka-app (Toxiproxy group: app -> every broker), kafka-connect,
#   pg-app, pg-connect, pg-all (both pg groups), postgres (primary)
#
# NETWORK FAULT RULE
#   A network fault targets the publisher's path: kafka-app for P1-P3 and
#   kafka-connect for P4-P5. Postgres faults use pg-app for P1-P3 and pg-all for
#   P4-P5, which also reaches Debezium.
#
# RECOVERY RULE
#   A component killed by a crash point or `crash` fault is RECREATED (not
#   restarted) with CRASH_AT/STALL_AT cleared, after the last fault in the
#   cycle has ended (immediately if no other fault is active).
#
# TIMING
#   Load runs: warm-up -> faults -> until last fault recovered + post_fault_s.
#   at_s and burst_at_s both count from the end of warm-up.
#   Vectors without faults use load.duration_s instead.
# =============================================================================

defaults:
  repeats: 30
  load: { mode: constant, rate_per_s: 100, warmup_s: 10, post_fault_s: 20 }
  drain: { quiet_s: 10, timeout_s: 480 }
  topology:
    relays: 1
    brokers: 1
    replication: async
    consumers: []
    consumers_per_group: 1
  env:
    KAFKA_ACKS: all
    KAFKA_IDEMPOTENT: true
    KAFKA_LINGER_MS: 5
    KAFKA_SYNC_SEND: false
    KAFKA_REQUEST_TIMEOUT_MS: 3000
    KAFKA_DELIVERY_TIMEOUT_MS: 5000
    KAFKA_REQUEST_OVERHEAD_MS: 1000       # franz-go default is 10000; see SPEC 6.4
    KAFKA_MAX_BUFFERED_RECORDS: 50000     # kept deliberately; C-1 measures the blocking
    TOPIC_PARTITIONS: 3
    TOPIC_RF: 1
    TOPIC_MIN_ISR: 1
    RETRY_MAX: 5
    RETRY_BASE_MS: 200
    RELAY_BATCH_SIZE: 100
    RELAY_POLL_INTERVAL_MS: 500
    RELAY_DB_TIMEOUT_MS: 5000             # matches the order service's request limit
    OFFSET_FLUSH_MS: 60000
    DEBEZIUM_POLL_INTERVAL_MS: 500        # Debezium default, set explicitly
    DEBEZIUM_RETRY_WAIT_MS: 10000         # Debezium default; affects failover recovery (SPEC 9.3)
    CONNECT_EOS: off                      # off | on (see SPEC 9.2)
    CDC_FAILOVER_RECOVERY: new_slot_no_snapshot
    CONSUMER_COMMIT_ORDER: effect_first   # effect_first | offset_first
    CONSUMER_SESSION_TIMEOUT_MS: 10000
    CRASH_AFTER_N: 50
    PG_IDLE_TX_TIMEOUT_S: 10
    REPL_LATENCY_MS: 0                    # delay on the pg-repl proxy (D-1)

vectors:
  - id: X-1
    group: X
    priority: optional
    mode: random
    patterns: [P4, P5]
    repeats: 10
    faults:
      - { type: proxy_disable, target: pg-connect, at_s: [10, 10], duration_s: 5 }
    expect: Cutting Debezium's Postgres connection sends its task through the retry path while the slot survives. Any loss here would be a real CDC loss, not a consequence of losing the slot.
