      - { type: pause, target: relay-any, at_s: [15, 25], duration_s: [2, 8] }
      - { type: crash, target: relay-any, at_s: [25, 35] }
    sweep: { topology.relays: [2, 4] }
    expect: Ordering and duplicate damage under concurrency and mixed faults.

